[project]
name = "netbox-device-type-importer"
version = "1.0.0"
description = "Optimized async importer for the NetBox Device Type Library"
readme = "README.md"
authors = [{ name = "Abacus AI", email = "support@abacus.ai" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "GitPython>=3.1.32",
    "pynetbox>=7.4.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "loguru>=0.7.2",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["devicetype_importer"]

[tool.hatch.build.targets.sdist]
include = ["main.py", "devicetype_importer", "README.md", "pyproject.toml"]

[project.scripts]
# This allows you to run the importer using the command 'nb-dt-import'
nb-dt-import = "devicetype_importer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
python-preference = "managed"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
